services:
  - type: web
    name: estadistica-operativa
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: estadistica-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: BACKUP_DIR
        value: /data/backups
